name: submission
description: "Food Recognizer App - Submission Dicoding"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  image_picker: ^1.2.0
  tflite_flutter: ^0.11.0
  path_provider: ^2.0.15
  http: ^1.2.2
  image: ^3.2.2
  camera: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/model.tflite
    - assets/probability-labels.txt
    - assets/probability-labels-en.txt
